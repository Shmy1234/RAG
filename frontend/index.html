<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Copilot — Specify the Filing. Get the Passage Back.</title>
    <meta
      name="description"
      content="Document Copilot answers questions about SEC filings and shows you the passage it used, with the filing, item, and page attached to every claim."
    />
    <meta property="og:title" content="Document Copilot" />
    <meta
      property="og:description"
      content="Grounded answers over SEC filings, with the passage attached."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      try {
        var stored = localStorage.getItem('theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
