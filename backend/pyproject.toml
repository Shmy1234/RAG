[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "fastapi==0.140.0",
    "httpx==0.28.1",
    "openai==2.48.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-ai==2.18.0",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.51.0",
]

[project.scripts]
document-copilot-ingest = "ingest.run:main"

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "docling==2.115.0",
    "ipykernel==7.3.0",
    "pytest==9.1.1",
    "ruff==0.16.0",
]
